<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer"><title>Talk</title>
<style>body{margin:0;height:100vh;display:grid;place-items:center;font:16px system-ui,sans-serif;color:#555;background:#fff}</style></head>
<body><p id="m">Loading…</p><script>
(async()=>{const m=document.getElementById('m');const k=location.hash.slice(1);
if(!k){m.textContent='This link is incomplete.';return;}
try{const b64=k.replace(/-/g,'+').replace(/_/g,'/');const raw=Uint8Array.from(atob(b64+'==='.slice((b64.length+3)%4)),c=>c.charCodeAt(0));
const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
const buf=new Uint8Array(await (await fetch('deck.bin',{cache:'no-store'})).arrayBuffer());
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));
const html=new TextDecoder().decode(pt);
const f=document.createElement('iframe');f.allow='fullscreen; autoplay';f.setAttribute('allowfullscreen','');
f.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0';
f.onload=()=>{document.title=f.contentDocument.title;f.focus();f.contentWindow.focus();};
f.srcdoc=html;m.remove();document.body.appendChild(f);
addEventListener('keydown',e=>{f.focus();f.contentWindow.dispatchEvent(new KeyboardEvent('keydown',{key:e.key}));});}   // keys that reach the outer page before the frame has focus
catch(e){m.textContent='This link is not valid.';}})();
</script></body></html>
