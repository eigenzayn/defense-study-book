<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Study</title><style>
:root{--ink:#14171c;--mute:#5f6670;--line:#e3e6ea;--ext:#0f766e;--bg:#fff}
@media (prefers-color-scheme:dark){:root{--ink:#e8eaed;--mute:#a0a7b0;--line:#2c3138;--ext:#2dd4bf;--bg:#111417}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}h1{font-size:22px;margin:0 0 4px}p.s{color:var(--mute);margin:0 0 18px}
a{color:var(--ext)}audio{width:100%;margin:8px 0 4px}
section{border-top:1px solid var(--line);padding:22px 0 8px}h2{font-size:19px;margin:0 0 10px;display:flex;justify-content:space-between;gap:12px}h2 small{font:500 13px ui-monospace,monospace;color:var(--mute)}
section img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:6px}
.al{background:rgba(47,94,158,.08);border-left:3px solid #2f5e9e;padding:8px 12px;border-radius:4px;font-size:15px;margin:10px 0}
.nk p{margin:0 0 8px}.kw{font-size:14.5px;color:var(--mute);margin:6px 0 0;padding-left:20px}</style></head>
<body><main><h1>Study material</h1><p class="s" id="m">Loading…</p><div id="all"></div><div id="sl"></div></main><script>
async function K(){const k=location.hash.slice(1);if(!k)throw 0;const b=k.replace(/-/g,'+').replace(/_/g,'/');
return crypto.subtle.importKey('raw',Uint8Array.from(atob(b+'==='.slice((b.length+3)%4)),c=>c.charCodeAt(0)),'AES-GCM',false,['decrypt']);}
async function D(key,u,type){const x=new Uint8Array(await (await fetch(u,{cache:'no-store'})).arrayBuffer());
return URL.createObjectURL(new Blob([await crypto.subtle.decrypt({name:'AES-GCM',iv:x.slice(0,12)},key,x.slice(12))],{type}));}
const E=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
(async()=>{const m=document.getElementById('m');let key;
try{key=await K();}catch(e){m.textContent='This link is incomplete.';return;}
try{const G=JSON.parse(await (await fetch(await D(key,'n.bin','application/json'))).text());
 const g=await D(key,'g.bin','application/pdf');
 m.innerHTML='Per slide: picture, audio and script · <a href="'+g+'" download="Panduan_Hafalan_Talk_Singkat.pdf">download the PDF guide</a>';
 document.getElementById('all').innerHTML='<h2>Whole talk</h2><audio controls preload="none" src="'+await D(key,'a00.bin','audio/mpeg')+'"></audio>';
 for(const x of G){const n=String(x.slide).padStart(2,'0');
  const [img,au]=await Promise.all([D(key,'s'+n+'.bin','image/png'),D(key,'a'+n+'.bin','audio/mpeg')]);
  const s=document.createElement('section');
  s.innerHTML='<h2><span>Slide '+x.slide+' · '+E(x.title)+'</span><small>'+E(x.time)+'</small></h2><img alt="Slide '+x.slide+'" src="'+img+'">'
   +'<audio controls preload="none" src="'+au+'"></audio><div class="al">'+E(x.alur)+'</div>'
   +'<div class="nk">'+x.paras.map(p=>'<p>'+E(p)+'</p>').join('')+'</div><ol class="kw">'+x.kw.map(k=>'<li>'+E(k)+'</li>').join('')+'</ol>';
  document.getElementById('sl').appendChild(s);}}
catch(e){m.textContent='This link is not valid.';}})();
</script></body></html>
