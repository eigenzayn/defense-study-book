<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Defense Audio</title>
<style>
  /* ==========================================================================
     Defense audio: listen, read along, shadow, recall (18 Oct 2026). Offline, file://.
     Data: data.js (built by build_audio.py). Same identity as the decks: Charis SIL, JKU blue.
     ======================================================================== */
  @font-face { font-family: "Charis"; src: url("../shared/fonts/CharisSIL-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Charis"; src: url("../shared/fonts/CharisSIL-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "Charis"; src: url("../shared/fonts/CharisSIL-Italic.ttf"); font-style: italic; }
  :root { --bg: #f5f7f9; --panel: #ffffff; --ink: #14181c; --ink-2: #3c444d; --mute: #6b737d; --rule: #dde2e7;
    --jku: #046e98; --jku-soft: #e2eff4; --hl: #fff1c2; --accent: #c4502f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1419; --panel: #131c23; --ink: #e9eef2; --ink-2: #c3ccd4; --mute: #8b96a0;
    --rule: #26323c; --jku: #5cb4d8; --jku-soft: #16313f; --hl: #4a3f12; --accent: #e07a58; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Charis", Georgia, serif; }
  body { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }

  /* === SIDEBAR: tracks by group === */
  aside { background: var(--panel); border-right: 1px solid var(--rule); padding: 22px 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  aside h1 { font-size: 22px; margin: 0 22px 2px; }
  aside .sub { font-size: 14px; color: var(--mute); margin: 0 22px 18px; }
  aside h2 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--jku); margin: 18px 22px 6px; }
  aside button.tr { display: grid; grid-template-columns: 1fr auto; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: 15px;
    background: none; border: 0; border-left: 3px solid transparent; padding: 8px 22px 8px 19px; color: var(--ink-2); cursor: pointer; }
  aside button.tr:hover { background: var(--jku-soft); }
  aside button.tr.on { border-left-color: var(--jku); background: var(--jku-soft); color: var(--ink); font-weight: 700; }
  aside button.tr .d { color: var(--mute); font-size: 13px; font-variant-numeric: tabular-nums; }
  aside button.tr .bar { grid-column: 1 / -1; height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
  aside button.tr .bar i { display: block; height: 100%; background: var(--jku); width: 0; }

  /* === MAIN: player + transcript === */
  main { padding: 0 48px 120px; max-width: 920px; }
  .player { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 22px 0 14px; border-bottom: 1px solid var(--rule); }
  .player h3 { margin: 0 0 4px; font-size: 26px; line-height: 1.2; }
  .player .meta { color: var(--mute); font-size: 14px; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row button { font: inherit; font-size: 15px; padding: 7px 14px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink);
    border-radius: 6px; cursor: pointer; }
  .row button.main { background: var(--jku); color: #fff; border-color: var(--jku); min-width: 92px; font-weight: 700; }
  .row button.on { background: var(--jku-soft); border-color: var(--jku); color: var(--jku); font-weight: 700; }
  .row .sep { width: 1px; height: 26px; background: var(--rule); margin: 0 4px; }
  .seek { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 14px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .seek input { flex: 1; accent-color: var(--jku); }
  .hint { font-size: 13px; color: var(--mute); margin-top: 8px; }

  .tx section { margin-top: 30px; }
  .tx h4 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--jku); margin: 0 0 10px; }
  .tx p { font-size: 21px; line-height: 1.65; margin: 0 0 16px; }
  .tx span.s { cursor: pointer; border-radius: 3px; transition: background .2s, filter .2s; padding: 1px 0; }
  .tx span.s:hover { background: var(--jku-soft); }
  .tx span.s.now { background: var(--hl); }
  body.recall .tx span.s:not(.now):not(.shown) { filter: blur(5px); }
  .shadowbadge { display: none; margin-left: 6px; color: var(--accent); font-size: 14px; font-weight: 700; }
  body.waiting .shadowbadge { display: inline; }

  @media (max-width: 760px) { body { grid-template-columns: 1fr; } aside { position: static; height: auto; }
    main { padding: 0 16px 100px; } .tx p { font-size: 19px; } }
  @media print { aside, .player .row, .seek, .hint { display: none; } body { display: block; background: #fff; }
    .player { position: static; } body.recall .tx span.s { filter: none !important; } .tx span.s.now { background: none; } }
</style>
</head>
<body>
<aside>
  <h1>Defense Audio</h1>
  <p class="sub">Listen, read along, repeat aloud.</p>
  <nav id="list"></nav>
</aside>
<main>
  <div class="player">
    <h3 id="title">Choose a track</h3>
    <div class="meta" id="meta"></div>
    <div class="row">
      <button class="main" id="play">Play</button>
      <button id="prev" title="previous sentence (←)">‹ sentence</button>
      <button id="next" title="next sentence (→)">sentence ›</button>
      <span class="sep"></span>
      <button id="speed" title="playback speed">1.0×</button>
      <button id="shadow" title="pause after each sentence so you can repeat it aloud (S)">Shadow</button>
      <button id="loop" title="repeat the current sentence (L)">Loop</button>
      <button id="recall" title="blur the text; try to recall, click to reveal (H)">Recall</button>
      <span class="shadowbadge">your turn…</span>
    </div>
    <div class="seek"><span id="cur">0:00</span><input type="range" id="pos" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
    <div class="hint">Space play/pause · ← → sentence · S shadow · L loop · H recall · click any sentence to jump</div>
  </div>
  <div class="tx" id="tx"></div>
</main>
<audio id="au" preload="metadata"></audio>
<script src="data.js"></script>
<script>
(function () {
  "use strict";
  /* === STATE === */
  const D = window.AUDIO || { groups: [], tracks: [] };
  const au = document.getElementById("au"), tx = document.getElementById("tx");
  const $ = (id) => document.getElementById(id);
  const SPEEDS = [0.8, 0.9, 1.0, 1.1, 1.25];
  let track = null, sents = [], cur = -1, shadow = false, loop = false, waitT = null;
  const store = {
    get(k, d) { try { const v = localStorage.getItem("defaudio." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("defaudio." + k, JSON.stringify(v)); } catch (e) {} }
  };
  const fmt = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

  /* === TRACK LIST === */
  function renderList() {
    $("list").innerHTML = D.groups.map(g => {
      const items = D.tracks.filter(t => t.group === g.id);
      if (!items.length) return "";
      return `<h2>${g.title}</h2>` + items.map(t => {
        const p = Math.min(100, (store.get("pos." + t.id, 0) / t.duration) * 100);
        return `<button class="tr" data-id="${t.id}"><span>${t.title}</span><span class="d">${fmt(t.duration)}</span><span class="bar"><i style="width:${p}%"></i></span></button>`;
      }).join("");
    }).join("");
    $("list").querySelectorAll("button.tr").forEach(b => b.onclick = () => load(b.dataset.id, true));
  }

  /* === LOAD A TRACK: transcript with one span per sentence === */
  function load(id, autoplay) {
    track = D.tracks.find(t => t.id === id); if (!track) return;
    store.set("track", id);
    document.querySelectorAll("button.tr").forEach(b => b.classList.toggle("on", b.dataset.id === id));
    $("title").textContent = track.title;
    $("meta").textContent = `voice ${track.voice} · ${fmt(track.duration)} · built ${D.built}`;
    sents = []; let html = "";
    track.sections.forEach(sec => {
      html += "<section>" + (sec.title ? `<h4>${sec.title}</h4>` : "");
      sec.paras.forEach(p => {
        html += "<p>" + p.map(s => { sents.push(s); return `<span class="s" data-i="${sents.length - 1}">${s.text}</span>`; }).join(" ") + "</p>";
      });
      html += "</section>";
    });
    tx.innerHTML = html; cur = -1;
    tx.querySelectorAll("span.s").forEach(el => el.onclick = () => {
      if (document.body.classList.contains("recall") && !el.classList.contains("shown") && !el.classList.contains("now")) { el.classList.add("shown"); return; }
      seekTo(+el.dataset.i, true);
    });
    au.src = track.file; au.playbackRate = SPEEDS[store.get("speed", 2)];
    au.onloadedmetadata = () => { $("dur").textContent = fmt(au.duration); const p = store.get("pos." + id, 0); if (p < au.duration - 2) au.currentTime = p; if (autoplay) au.play(); };
  }

  /* === SENTENCE TRACKING, SHADOW AND LOOP === */
  function idxAt(t) { for (let i = sents.length - 1; i >= 0; i--) if (t >= sents[i].t0 - 0.02) return i; return 0; }
  function mark(i) {
    if (i === cur) return;
    const old = tx.querySelector("span.s.now"); if (old) old.classList.remove("now");
    cur = i; const el = tx.querySelector(`span.s[data-i="${i}"]`);
    if (el) { el.classList.add("now"); const r = el.getBoundingClientRect(); if (r.top < 220 || r.bottom > innerHeight - 60) el.scrollIntoView({ block: "center", behavior: "smooth" }); }
  }
  function seekTo(i, play) { i = Math.max(0, Math.min(sents.length - 1, i)); clearTimeout(waitT); document.body.classList.remove("waiting");
    au.currentTime = sents[i].t0; mark(i); if (play) au.play(); }
  /* sentence-end check every frame: timeupdate fires only about every 250 ms */
  (function tick() {
    if (track && !au.paused && cur >= 0 && (shadow || loop) && au.currentTime >= sents[cur].t1 - 0.03) {
      const s = sents[cur]; au.pause();
      if (loop) waitT = setTimeout(() => { au.currentTime = s.t0; au.play(); }, 600);
      else { document.body.classList.add("waiting");
        waitT = setTimeout(() => { document.body.classList.remove("waiting"); seekTo(cur + 1, true); }, (s.t1 - s.t0) / au.playbackRate * 1100 + 500); }
    } else if (track && !au.paused && (!(shadow || loop) || cur < 0)) mark(idxAt(au.currentTime));
    requestAnimationFrame(tick);
  })();
  au.ontimeupdate = () => {
    if (!track) return;
    const t = au.currentTime; $("cur").textContent = fmt(t); $("pos").value = Math.round(t / (au.duration || 1) * 1000);
    if (au.paused) mark(idxAt(t));
    if (Math.round(t) % 5 === 0) store.set("pos." + track.id, t);
  };
  au.onplay = () => { $("play").textContent = "Pause"; };
  au.onpause = () => { $("play").textContent = "Play"; if (track) store.set("pos." + track.id, au.currentTime); };
  au.onended = () => { store.set("pos." + track.id, 0); renderList(); document.querySelector(`button.tr[data-id="${track.id}"]`)?.classList.add("on"); };

  /* === CONTROLS === */
  function toggle() { if (!track) return; clearTimeout(waitT); document.body.classList.remove("waiting"); au.paused ? au.play() : au.pause(); }
  $("play").onclick = toggle;
  $("prev").onclick = () => seekTo(cur - 1, !au.paused);
  $("next").onclick = () => seekTo(cur + 1, !au.paused);
  $("pos").oninput = (e) => { au.currentTime = e.target.value / 1000 * (au.duration || 0); };
  function setSpeed(k) { store.set("speed", k); au.playbackRate = SPEEDS[k]; $("speed").textContent = SPEEDS[k].toFixed(1).replace(/\.0$/, ".0") + "×"; }
  $("speed").onclick = () => setSpeed((store.get("speed", 2) + 1) % SPEEDS.length);
  function flag(btn, on) { $(btn).classList.toggle("on", on); }
  $("shadow").onclick = () => { shadow = !shadow; if (shadow) loop = false; flag("shadow", shadow); flag("loop", loop); };
  $("loop").onclick = () => { loop = !loop; if (loop) shadow = false; flag("loop", loop); flag("shadow", shadow); };
  $("recall").onclick = () => { const on = document.body.classList.toggle("recall"); flag("recall", on); tx.querySelectorAll(".shown").forEach(e => e.classList.remove("shown")); };
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === " ") { e.preventDefault(); toggle(); }
    else if (e.key === "ArrowLeft") seekTo(cur - 1, !au.paused);
    else if (e.key === "ArrowRight") seekTo(cur + 1, !au.paused);
    else if (e.key === "s" || e.key === "S") $("shadow").click();
    else if (e.key === "l" || e.key === "L") $("loop").click();
    else if (e.key === "h" || e.key === "H") $("recall").click();
  });

  /* === START === */
  renderList(); setSpeed(store.get("speed", 2));
  const last = store.get("track", D.tracks[0] && D.tracks[0].id); if (last) load(last, false);
})();
</script>
</body>
</html>
