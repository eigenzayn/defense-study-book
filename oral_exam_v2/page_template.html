<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oral Exam Answers</title>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    macros: {
      Remp: 'R_{\\mathrm{emp}}', Rgen: 'R_{\\mathrm{gen}}', fsd: 'f_{\\mathrm{sd}}',
      why: ['&&\\text{(#1)}', 1], bm: ['\\boldsymbol{#1}', 1]
    }
  },
  svg: { fontCache: 'global' }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
:root {
  --bg: #fbfaf7; --card: #ffffff; --ink: #1d232b; --muted: #5f6b78; --line: #dde2e8;
  --accent: #1f4e79; --ask: #2e7d32; --askbg: #e7f3e8; --pred: #6b7280; --predbg: #eef0f3;
  --sum: #7a3e00; --sumbg: #fff6e8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171d; --card: #1a2129; --ink: #e6e9ed; --muted: #9aa5b1; --line: #2c3540;
    --accent: #8ab4dd; --ask: #7cc683; --askbg: #1d3022; --pred: #a3aab3; --predbg: #262d36;
    --sum: #f0b27a; --sumbg: #2e2418;
  }
}
:root[data-theme="dark"] {
  --bg: #12171d; --card: #1a2129; --ink: #e6e9ed; --muted: #9aa5b1; --line: #2c3540;
  --accent: #8ab4dd; --ask: #7cc683; --askbg: #1d3022; --pred: #a3aab3; --predbg: #262d36;
  --sum: #f0b27a; --sumbg: #2e2418;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 10px 16px; }
header h1 { font-size: 18px; margin: 0 0 6px; color: var(--accent); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools button, .tools input { font: inherit; font-size: 14px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.tools input { cursor: text; min-width: 180px; flex: 1; max-width: 320px; }
.tools button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.count { font-size: 13px; color: var(--muted); }
.wrap { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; max-width: 1180px;
  margin: 0 auto; padding: 16px; }
nav { position: sticky; top: 96px; align-self: start; max-height: calc(100vh - 110px); overflow: auto;
  font-size: 14px; }
nav ul { list-style: none; padding-left: 0; margin: 0; }
nav ul ul { padding-left: 12px; margin: 2px 0 10px; }
nav a { color: var(--ink); text-decoration: none; }
nav a:hover { color: var(--accent); }
nav .n { color: var(--muted); font-size: 12px; }
h2 { color: var(--accent); font-size: 24px; margin: 28px 0 8px; }
h3 { color: var(--accent); font-size: 18px; margin: 24px 0 8px; }
.intro { color: var(--muted); }
details.qa { background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin: 10px 0;
  padding: 0 14px; }
details.qa > summary { cursor: pointer; padding: 10px 0; font-weight: 600; list-style: none;
  display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
details.qa > summary::-webkit-details-marker { display: none; }
.qid { color: var(--muted); font-weight: 500; font-size: 13px; min-width: 2.6em; }
.badge { margin-left: auto; font-size: 11px; font-weight: 600; letter-spacing: .04em; border-radius: 4px;
  padding: 1px 6px; }
.badge.asked { color: var(--ask); background: var(--askbg); }
.badge.predicted { color: var(--pred); background: var(--predbg); }
.origin { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
.lab { color: var(--accent); font-weight: 600; }
.core { font-style: italic; }
.math { overflow-x: auto; overflow-y: hidden; }
.summary { background: var(--sumbg); color: var(--sum); border-radius: 6px; padding: 6px 10px; }
.summary span { font-weight: 600; }
.src { font-size: 12px; color: var(--muted); }
.tip { background: var(--sumbg); border-radius: 8px; padding: 10px 14px; margin: 10px 0; }
table.talk { border-collapse: collapse; width: 100%; font-size: 14px; margin: 8px 0; }
table.talk td { border-top: 1px solid var(--line); padding: 4px 6px; vertical-align: top; }
table.talk tr:first-child td { font-weight: 600; }
.reveal, .known { font-size: 13px; border: 1px solid var(--line); background: transparent; color: var(--accent);
  border-radius: 6px; padding: 2px 8px; cursor: pointer; margin: 0 6px 10px 0; }
.known.on { color: var(--ask); border-color: var(--ask); }
body.practice details.qa .rest { display: none; }
body.practice details.qa.show .rest { display: block; }
body:not(.practice) .reveal { display: none; }
.hidden { display: none !important; }
@media (max-width: 820px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  nav { position: static; max-height: none; }
}
</style>
</head>
<body>
<header>
  <h1>Oral examination: spoken answers</h1>
  <div class="tools">
    <button data-f="all" class="on">All</button>
    <button data-f="asked">Asked before</button>
    <button data-f="predicted">Predicted</button>
    <input id="q" type="search" placeholder="Search questions">
    <button id="practice">Practice mode</button>
    <button id="theme">Theme</button>
    <span class="count" id="count"></span>
  </div>
</header>
<div class="wrap">
<nav><ul>
{{NAV}}
</ul>
<p class="intro" style="font-size:13px">Asked before: in the list of past defenses, with the examiner. Predicted: not in that list. PDF version: <a href="oral_exam_v2.pdf">oral_exam_v2.pdf</a>.</p>
</nav>
<main>
{{BODY}}
</main>
</div>
<script>
(function () {
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var qs = Array.prototype.slice.call(document.querySelectorAll('details.qa'));
  var filter = 'all', term = '';
  qs.forEach(function (d) {
    var id = d.querySelector('.qid').textContent.trim();
    var core = d.querySelector('.core');
    var reveal = document.createElement('button');
    reveal.className = 'reveal'; reveal.textContent = 'Show answer';
    reveal.addEventListener('click', function () {
      d.classList.toggle('show');
      reveal.textContent = d.classList.contains('show') ? 'Hide answer' : 'Show answer';
    });
    var known = document.createElement('button');
    known.className = 'known'; known.textContent = 'I know this';
    if (store.get('known-' + id) === '1') known.classList.add('on');
    known.addEventListener('click', function () {
      known.classList.toggle('on');
      store.set('known-' + id, known.classList.contains('on') ? '1' : '0');
    });
    core.parentNode.insertBefore(reveal, core.nextSibling);
    core.parentNode.insertBefore(known, reveal.nextSibling);
  });
  function apply() {
    var n = 0;
    qs.forEach(function (d) {
      var ok = (filter === 'all' || d.classList.contains(filter)) &&
               (!term || d.dataset.text.indexOf(term) >= 0 || d.textContent.toLowerCase().indexOf(term) >= 0);
      d.classList.toggle('hidden', !ok);
      if (ok) n++;
    });
    document.getElementById('count').textContent = n + ' of ' + qs.length + ' questions';
  }
  document.querySelectorAll('[data-f]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('[data-f]').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on'); filter = b.dataset.f; apply();
    });
  });
  document.getElementById('q').addEventListener('input', function (e) { term = e.target.value.toLowerCase(); apply(); });
  var pr = document.getElementById('practice');
  pr.addEventListener('click', function () {
    document.body.classList.toggle('practice'); pr.classList.toggle('on');
  });
  var th = document.getElementById('theme');
  var saved = store.get('theme');
  if (saved) document.documentElement.dataset.theme = saved;
  th.addEventListener('click', function () {
    var dark = document.documentElement.dataset.theme === 'dark' ||
      (!document.documentElement.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var next = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next; store.set('theme', next);
  });
  apply();
})();
</script>
</body>
</html>
